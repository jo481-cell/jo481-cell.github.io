<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" xml:lang="{{language}}">
  <title>{{title}}</title>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0 0H100 M0 0V100" fill="none" stroke="#f6e6b7" stroke-width="2"/>
    </pattern>
    <style>
      text{fill:#fff0cf;stroke:#17221c;stroke-width:5;stroke-linejoin:round;paint-order:stroke}
      .site-labels text{stroke-width:4}
      .site-leader{fill:none;stroke:#f0d9a6;stroke-width:2;stroke-dasharray:1 4;stroke-linecap:round}
      .site-origin{fill:#ffe6ad;stroke:#17221c;stroke-width:1}
    </style>
  </defs>
  <rect x="18" y="18" width="964" height="964" fill="url(#grid)" opacity=".23"/>
  <rect x="18" y="18" width="964" height="964" fill="none" stroke="#f3dbac" stroke-opacity=".54"/>
  <g font-family="system-ui,sans-serif" font-weight="650" font-size="13">{{coordinates}}</g>
  <g font-family="Georgia,serif" font-size="28" font-weight="700" text-anchor="middle">{{labels}}</g>
  <g class="site-labels" font-family="system-ui,sans-serif" font-size="20" font-weight="650">{{site_labels}}</g>
</svg>
